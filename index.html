<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Система баллов">
    <title>Система баллов — Вход</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="msapplication-TileImage" content="icon.svg">
</head>

<body>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
        <i class="fas fa-sun"></i>
        <span>Светлый</span>
    </button>

    <div class="container">
        <div id="login-screen" class="screen active">
            <div style="max-width: 320px; margin: 0 auto; text-align: center;">
                <i class="fas fa-shield-halved" style="font-size: 60px; color: var(--primary); margin-bottom: 20px;"></i>
                <h2 style="margin: 0 0 25px 0;">Система баллов</h2>
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="login-input" placeholder="Логин"></div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="pass-input" placeholder="Пароль">
                    <button class="password-toggle" type="button" onclick="togglePasswordVisibility()" aria-label="Показать пароль">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <button onclick="auth()">Войти в систему</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
