<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Система баллов">
    <title>Система баллов — Баланс</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="msapplication-TileImage" content="icon.svg">
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
        <i class="fas fa-sun"></i>
        <span>Светлый</span>
    </button>

    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer()"></div>

    <div id="side-drawer" class="side-drawer">
        <h3 style="margin: 0 0 10px 0; color: var(--primary);">Новый запрос</h3>
        <textarea id="request-text" style="height: 150px; padding: 12px; margin-bottom: 15px;" placeholder="Опиши свою просьбу или вопрос..."></textarea>
        <button onclick="sendRequestToServer()">Отправить запрос</button>
        <button onclick="toggleDrawer()" style="background: transparent; border: 1px solid var(--border); color: var(--text);">Отмена</button>
    </div>

    <div class="container">
        <div id="main-screen" class="screen active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap;">
                <div style="font-weight: bold; font-size: 18px;">
                    <i class="fas fa-user-circle"></i> <span id="user-name"></span>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <button onclick="toggleDrawer()" style="width: auto; padding: 8px 15px; background: var(--primary); margin:0;">
                        <i class="fas fa-comment-dots"></i> Написать запрос
                    </button>
                    <button onclick="logout()" style="width: auto; padding: 8px 15px; background: var(--primary); margin:0;">
                        <i class="fas fa-sign-out-alt"></i> Выход
                    </button>
                </div>
            </div>

            <div class="dashboard">
                <div id="left-column"></div>
                <div id="right-column"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
